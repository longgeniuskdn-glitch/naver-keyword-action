name: PART 04-06 Actual UI Demo v3

on:
  pull_request:
    paths:
      - ".github/workflows/part04-06-demo-static-v3.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  create-demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download verified launcher v0.4
        uses: actions/download-artifact@v4
        with:
          name: ai-operations-launcher-v04-part05-direct-learning
          path: .demo/bundle
          repository: ${{ github.repository }}
          run-id: 30200476544
          github-token: ${{ github.token }}

      - name: Install capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Start apps, prepare sample data, and capture screens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p demo-output .demo/runtime .demo/logs
          P4_APP="$(find .demo/bundle -path '*/modules/part04/app.py' -print -quit)"
          P5_APP="$(find .demo/bundle -path '*/modules/part05/app.py' -print -quit)"
          P6_APP="$(find .demo/bundle -path '*/modules/part06/app.py' -print -quit)"
          test -n "$P4_APP" && test -n "$P5_APP" && test -n "$P6_APP"

          start_app() {
            local part="$1" app="$2" port="$3"
            shift 3
            local dir
            dir="$(dirname "$app")"
            (
              cd "$dir"
              env "$@" AUTO_OPEN_BROWSER=0 python app.py --no-browser
            ) >"$GITHUB_WORKSPACE/.demo/logs/${part}.log" 2>&1 &
            echo $!
          }

          PID4=$(start_app part04 "$P4_APP" 8794 \
            AI_DIAGNOSIS_DATA="$GITHUB_WORKSPACE/.demo/runtime/part04/data" \
            AI_DIAGNOSIS_OUTPUT="$GITHUB_WORKSPACE/.demo/runtime/part04/output" \
            AI_DIAGNOSIS_BACKUP="$GITHUB_WORKSPACE/.demo/runtime/part04/backups")
          PID5=$(start_app part05 "$P5_APP" 8795 \
            INTAKE_DATA_DIR="$GITHUB_WORKSPACE/.demo/runtime/part05/data" \
            INTAKE_BACKUP_DIR="$GITHUB_WORKSPACE/.demo/runtime/part05/backups" \
            INTAKE_DB="$GITHUB_WORKSPACE/.demo/runtime/part05/data/intake.db" \
            AI_FEEDBACK_DB="$GITHUB_WORKSPACE/.demo/runtime/shared/feedback.db" \
            AI_MEMORY_ROOT="$GITHUB_WORKSPACE/.demo/runtime/shared/memory" \
            INTAKE_QUIET=1)
          PID6=$(start_app part06 "$P6_APP" 8796 \
            KNOWLEDGE_DATA_DIR="$GITHUB_WORKSPACE/.demo/runtime/part06/data" \
            KNOWLEDGE_SOURCE_DIR="$GITHUB_WORKSPACE/.demo/runtime/part06/knowledge" \
            KNOWLEDGE_OUTPUT_DIR="$GITHUB_WORKSPACE/.demo/runtime/part06/output" \
            KNOWLEDGE_BACKUP_DIR="$GITHUB_WORKSPACE/.demo/runtime/part06/backups" \
            KNOWLEDGE_DB="$GITHUB_WORKSPACE/.demo/runtime/part06/data/knowledge.db" \
            AI_COMPANY_EVENT_LOG="$GITHUB_WORKSPACE/.demo/runtime/part06/data/events.jsonl" \
            KNOWLEDGE_QUIET=1)

          cleanup(){ kill "$PID4" "$PID5" "$PID6" 2>/dev/null || true; }
          trap cleanup EXIT

          for url in http://127.0.0.1:8794/health http://127.0.0.1:8795/health http://127.0.0.1:8796/health; do
            for attempt in $(seq 1 60); do
              curl -fsS "$url" >/dev/null && break
              sleep 0.4
              if [ "$attempt" = 60 ]; then
                cat .demo/logs/*.log || true
                exit 1
              fi
            done
          done

          curl -fsSL http://127.0.0.1:8794/demo >/dev/null
          curl -fsSL http://127.0.0.1:8795/demo >/dev/null
          curl -fsSL http://127.0.0.1:8796/demo >/dev/null

          cat > .demo/capture.js <<'JS'
          const { chromium } = require('playwright');
          const path = require('path');
          const fs = require('fs');
          const out = path.resolve('demo-output');
          fs.mkdirSync(out, { recursive: true });

          async function shot(url, name) {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, locale: 'ko-KR' });
            await page.goto(url, { waitUntil: 'networkidle' });
            await page.waitForTimeout(1000);
            await page.screenshot({ path: path.join(out, name), fullPage: true });
            await browser.close();
          }

          (async () => {
            await shot('http://127.0.0.1:8794', 'PART04_01_자동화진단결과.png');
            await shot('http://127.0.0.1:8795', 'PART05_01_업무분류대기열.png');
            await shot('http://127.0.0.1:8795/correct/1', 'PART05_02_분류수정_AI교육.png');
            await shot('http://127.0.0.1:8796', 'PART06_01_회사자료목록.png');
            await shot('http://127.0.0.1:8796/?q=' + encodeURIComponent('환불 7일'), 'PART06_02_환불근거검색.png');
          })().catch((error) => { console.error(error); process.exit(1); });
          JS
          node .demo/capture.js

          make_video() {
            local output="$1"
            shift
            local inputs=() filters=() labels=() index=0
            for image in "$@"; do
              inputs+=( -loop 1 -t 5 -i "$image" )
              filters+=( "[$index:v]scale=1440:-2:force_original_aspect_ratio=decrease,pad=1440:1000:(ow-iw)/2:(oh-ih)/2:color=white,fps=30,format=yuv420p,setpts=PTS-STARTPTS[v$index]" )
              labels+=( "[v$index]" )
              index=$((index+1))
            done
            local joined
            joined=$(IFS=';'; echo "${filters[*]}")
            local streams=""
            for label in "${labels[@]}"; do streams+="$label"; done
            ffmpeg -hide_banner -loglevel error -y "${inputs[@]}" \
              -filter_complex "$joined;${streams}concat=n=$index:v=1:a=0[v]" \
              -map '[v]' -c:v libx264 -preset veryfast -crf 23 -movflags +faststart "$output"
          }

          make_video demo-output/PART04_자동화진단실_실제화면.mp4 \
            demo-output/PART04_01_자동화진단결과.png
          make_video demo-output/PART05_업무분류_AI교육_실제화면.mp4 \
            demo-output/PART05_01_업무분류대기열.png \
            demo-output/PART05_02_분류수정_AI교육.png
          make_video demo-output/PART06_AI지식창고_실제화면.mp4 \
            demo-output/PART06_01_회사자료목록.png \
            demo-output/PART06_02_환불근거검색.png

          ffmpeg -hide_banner -loglevel error -y \
            -i demo-output/PART04_자동화진단실_실제화면.mp4 \
            -i demo-output/PART05_업무분류_AI교육_실제화면.mp4 \
            -i demo-output/PART06_AI지식창고_실제화면.mp4 \
            -filter_complex "[0:v]setpts=PTS-STARTPTS[v0];[1:v]setpts=PTS-STARTPTS[v1];[2:v]setpts=PTS-STARTPTS[v2];[v0][v1][v2]concat=n=3:v=1:a=0[v]" \
            -map '[v]' -c:v libx264 -preset veryfast -crf 23 -movflags +faststart \
            demo-output/PART04-06_통합_실제화면.mp4

          cat > demo-output/체험_안내.md <<'MD'
          # PART 04~06 실제 화면 자료

          검증된 통합 런처 v0.4의 프로그램을 Ubuntu 24.04에서 실제 실행하고, 프로그램이 만든 브라우저 화면을 캡처해 영상으로 구성했습니다.

          - PART 04: 샘플 반복 업무의 우선순위·월간 가치·운영 모드
          - PART 05: 업무 분류 대기열과 `분류 수정과 AI 교육` 화면
          - PART 06: 회사 자료 목록과 `환불 7일` 검색 근거

          Linux는 제작자가 자동 시험에 사용한 환경입니다. 사용자는 Mac에서 `START_MAC.command`를 실행하면 됩니다.
          현재 연결되지 않은 이메일 자동 수신·실제 답변 발송 기능은 포함하지 않았습니다.
          MD
          cp .demo/logs/*.log demo-output/ || true
          ls -lah demo-output

      - name: Upload actual UI demo package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part04-06-actual-ui-demo-v3
          path: |
            demo-output
            .demo/logs
          if-no-files-found: warn
          retention-days: 90
