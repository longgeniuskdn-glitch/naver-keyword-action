name: Build AI Code Usage v0.5.5 Claude Diagnostics
on:
  pull_request:
    branches: [ main ]
    paths:
      - "ai-code-usage-v050.chunk*"
      - "tools/patch-ai-code-usage-v055.py"
      - ".github/workflows/build-ai-code-usage-v055-claude-diagnostics.yml"
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          cat ai-code-usage-v050.chunk* | tr -d '[:space:]' | base64 --decode > /tmp/source.zip
          ACTUAL=$(shasum -a 256 /tmp/source.zip | awk '{print $1}')
          test "$ACTUAL" = "1a801110f75301d2e934aa31f57d7c0b8907df0632732ca87d56c5ed6a9fe36c"
          unzip -q /tmp/source.zip -d /tmp/src
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Apply Claude diagnostics patch
        run: |
          python3 tools/patch-ai-code-usage-v055.py
          cd /tmp/src/src/desktop
          node --check main.js
          grep -n "CLAUDE_CONFIG_DIR\|disableAllHooks\|ANTHROPIC_API_KEY\|claude-statusline-wrapper" main.js
      - name: Prepare official Codex and Claude helper
        working-directory: /tmp/src/src/desktop
        run: |
          mkdir -p vendor
          curl -L --fail --retry 3 https://github.com/openai/codex/releases/latest/download/codex-aarch64-apple-darwin.tar.gz -o /tmp/codex.tar.gz
          tar -xzf /tmp/codex.tar.gz -C /tmp
          cp /tmp/codex-aarch64-apple-darwin vendor/codex
          chmod 755 vendor/codex
          swiftc claude_capture.swift -o vendor/claude-capture
          chmod 755 vendor/claude-capture
          vendor/codex --version
      - name: Verify Claude helper fixture
        working-directory: /tmp/src/src/desktop
        run: |
          rm -rf "$HOME/.ai-code-usage"
          mkdir -p "$HOME/.ai-code-usage"
          printf '%s' '{"version":"2.1.90","rate_limits":{"five_hour":{"used_percentage":23.5,"resets_at":1738425600},"seven_day":{"used_percentage":41.2,"resets_at":1738857600}}}' | vendor/claude-capture | grep 'CL 5h 24% · 7d 41%'
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path.home()/'.ai-code-usage/claude-usage.json'
          j=json.loads(p.read_text())
          assert j['fiveHour']['usedPercent']==23.5
          assert j['sevenDay']['usedPercent']==41.2
          print('Claude helper fixture PASS')
          PY
      - name: Install test and build
        working-directory: /tmp/src/src/desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: |
          npm install
          npm test
          npm run dist:mac
      - name: Verify package
        working-directory: /tmp/src/src/desktop
        run: |
          APP=$(find dist -maxdepth 2 -type d -name '*.app' | head -1)
          codesign --verify --deep --strict "$APP"
          file "$APP/Contents/MacOS/AI Code Usage"
          file "$APP/Contents/Resources/vendor/codex"
          file "$APP/Contents/Resources/vendor/claude-capture"
          test -f dist/AI-Code-Usage-Mac-M4-v0.5.5.dmg
          test -f dist/AI-Code-Usage-Mac-M4-v0.5.5.zip
          shasum -a 256 dist/AI-Code-Usage-Mac-M4-v0.5.5.dmg dist/AI-Code-Usage-Mac-M4-v0.5.5.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Code-Usage-Mac-M4-v0.5.5-Claude-Diagnostics
          path: |
            /tmp/src/src/desktop/dist/AI-Code-Usage-Mac-M4-v0.5.5.dmg
            /tmp/src/src/desktop/dist/AI-Code-Usage-Mac-M4-v0.5.5.zip
