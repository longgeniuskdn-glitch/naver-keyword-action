name: TimSEOGuru Long-form SEO Analysis (single-run fallback)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --upgrade pip
          python -m pip install yt-dlp youtube-transcript-api pandas openpyxl requests pillow pytesseract
      - env:
          CHANNEL_URL: https://www.youtube.com/@TimSEOGuru/videos
          OUTPUT_DIR: out
        run: python scripts/timseo_collect.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TimSEOGuru-longform-SEO-analysis
          path: out/
          if-no-files-found: warn
          retention-days: 7
