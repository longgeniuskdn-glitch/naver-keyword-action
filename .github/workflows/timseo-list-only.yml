name: TimSEOGuru Videos-tab Inventory

on:
  push:
    branches:
      - chatgpt-timseo-longform-analysis-20260816
    paths:
      - scripts/timseo_list_only.py
      - .github/workflows/timseo-list-only.yml

permissions:
  contents: read

jobs:
  list-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install yt-dlp
      - run: python scripts/timseo_list_only.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TimSEOGuru-videos-tab-inventory
          path: out_list/
          if-no-files-found: warn
          retention-days: 7
