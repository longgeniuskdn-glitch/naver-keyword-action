name: Build AI Code Usage Mac v0.6.2 Safe Update R2
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ai-code-usage-mac-v062-safe-update-r2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore and patch
        run: |
          cat ai-code-usage-v050.chunk* | tr -d '[:space:]' | base64 --decode > /tmp/source.zip
          test "$(shasum -a 256 /tmp/source.zip | awk '{print $1}')" = "1a801110f75301d2e934aa31f57d7c0b8907df0632732ca87d56c5ed6a9fe36c"
          rm -rf /tmp/src && unzip -q /tmp/source.zip -d /tmp/src
          python3 tools/patch-ai-code-usage-v055b.py
          python3 tools/patch-ai-code-usage-v056-cache.py
          python3 tools/patch-ai-code-usage-v057-pty.py
          python3 tools/patch-ai-code-usage-v060-claude-oauth.py
          python3 tools/patch-ai-code-usage-v062-mac-safe.py
          cd /tmp/src/src/desktop
          node --check main.js
          node --check usage-core.js
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Test
        working-directory: /tmp/src/src/desktop
        run: |
          npm install
          node --test test/claude-oauth.test.js
          node --test test/claude-v062.test.js
          npm test
      - name: Prepare binaries
        working-directory: /tmp/src/src/desktop
        run: |
          mkdir -p vendor
          curl -L --fail --retry 4 --retry-delay 2 https://github.com/openai/codex/releases/latest/download/codex-aarch64-apple-darwin.tar.gz -o /tmp/codex.tar.gz
          tar -xzf /tmp/codex.tar.gz -C /tmp
          cp /tmp/codex-aarch64-apple-darwin vendor/codex
          chmod 755 vendor/codex
          swiftc "$GITHUB_WORKSPACE/tools/claude-capture-v055.swift" -o vendor/claude-capture-v055
          chmod 755 vendor/claude-capture-v055
      - name: Build app
        working-directory: /tmp/src/src/desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: npm run dist:mac
      - name: Verify app
        working-directory: /tmp/src/src/desktop
        run: |
          set -euo pipefail
          APP=$(find dist -maxdepth 2 -type d -name 'AI Code Usage.app' | head -1)
          test -n "$APP"
          codesign --verify --deep --strict "$APP"
          file "$APP/Contents/MacOS/AI Code Usage" | grep arm64
          file "$APP/Contents/Resources/vendor/codex" | grep arm64
          grep -a -q 'fableWeek' "$APP/Contents/Resources/app.asar"
          grep -a -q 'credentialCandidates' "$APP/Contents/Resources/app.asar"
          grep -a -q 'menuUsage' "$APP/Contents/Resources/app.asar"
      - name: Build AppTranslocation-safe updater
        working-directory: /tmp/src/src/desktop
        run: |
          set -euo pipefail
          APP=$(find dist -maxdepth 2 -type d -name 'AI Code Usage.app' | head -1)
          STAGE=/tmp/ai-code-usage-safe-r2
          HELPER="$STAGE/AI Code Usage 안전 업데이트.app"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cat > /tmp/safe-update-r2.applescript <<'APPLESCRIPT'
          on run
            set helperPath to POSIX path of (path to me)
            set newApp to helperPath & "Contents/Resources/Payload/AI Code Usage.app"
            set systemTarget to "/Applications/AI Code Usage.app"
            set userTarget to POSIX path of (path to home folder) & "Applications/AI Code Usage.app"
            set targetApp to systemTarget
            try
              set systemExists to do shell script "if [ -d " & quoted form of systemTarget & " ]; then echo yes; else echo no; fi"
              set userExists to do shell script "if [ -d " & quoted form of userTarget & " ]; then echo yes; else echo no; fi"
              if systemExists is "no" and userExists is "yes" then set targetApp to userTarget
            end try
            set backupDir to POSIX path of (path to home folder) & "Applications/AI Code Usage Backups"
            set choice to button returned of (display dialog "AI Code Usage 안전 업데이트\n\n현재 앱을 자동 백업한 뒤 v0.6.2로 교체합니다. 문제가 생기면 이 도우미를 다시 열어 이전 버전 복구를 누르세요." buttons {"취소", "이전 버전 복구", "업데이트 설치"} default button "업데이트 설치" with icon caution)
            if choice is "취소" then return
            if choice is "업데이트 설치" then
              set payloadExists to do shell script "if [ -d " & quoted form of newApp & " ]; then echo yes; else echo no; fi"
              if payloadExists is not "yes" then
                display dialog "업데이트 앱 내부의 새 버전을 찾지 못했습니다. 설치를 중단합니다." buttons {"확인"} default button 1 with icon stop
                return
              end if
              do shell script "/bin/mkdir -p " & quoted form of backupDir
              try
                do shell script "/usr/bin/killall 'AI Code Usage' >/dev/null 2>&1 || true"
              end try
              set stamp to do shell script "/bin/date +%Y%m%d-%H%M%S"
              set backupApp to backupDir & "/AI Code Usage backup-" & stamp & ".app"
              try
                do shell script "if [ -d " & quoted form of targetApp & " ]; then /usr/bin/ditto " & quoted form of targetApp & " " & quoted form of backupApp & "; fi"
              on error errm
                display dialog "기존 앱 백업에 실패해서 업데이트를 중단했습니다.\n" & errm buttons {"확인"} default button 1 with icon stop
                return
              end try
              try
                do shell script "/bin/rm -rf " & quoted form of targetApp & "; /usr/bin/ditto " & quoted form of newApp & " " & quoted form of targetApp
              on error
                try
                  do shell script "/bin/rm -rf " & quoted form of targetApp & "; /usr/bin/ditto " & quoted form of newApp & " " & quoted form of targetApp with administrator privileges
                on error errm2
                  display dialog "업데이트 복사에 실패했습니다. 기존 백업은 보존되어 있습니다.\n" & errm2 buttons {"확인"} default button 1 with icon stop
                  return
                end try
              end try
              do shell script "/usr/bin/open " & quoted form of targetApp
              display dialog "업데이트 완료. 문제가 있으면 이 도우미에서 이전 버전 복구를 누르세요.\n\n백업: " & backupApp buttons {"확인"} default button 1
            else if choice is "이전 버전 복구" then
              try
                set latestBackup to do shell script "/usr/bin/find " & quoted form of backupDir & " -maxdepth 1 -type d -name 'AI Code Usage backup-*.app' -print 2>/dev/null | /usr/bin/sort -r | /usr/bin/head -1"
                if latestBackup is "" then error "백업 없음"
                try
                  do shell script "/usr/bin/killall 'AI Code Usage' >/dev/null 2>&1 || true; /bin/rm -rf " & quoted form of targetApp & "; /usr/bin/ditto " & quoted form of latestBackup & " " & quoted form of targetApp
                on error
                  do shell script "/usr/bin/killall 'AI Code Usage' >/dev/null 2>&1 || true; /bin/rm -rf " & quoted form of targetApp & "; /usr/bin/ditto " & quoted form of latestBackup & " " & quoted form of targetApp with administrator privileges
                end try
                do shell script "/usr/bin/open " & quoted form of targetApp
                display dialog "이전 버전으로 복구했습니다.\n" & latestBackup buttons {"확인"} default button 1
              on error errm
                display dialog "복구할 백업을 찾지 못했거나 복구에 실패했습니다.\n" & errm buttons {"확인"} default button 1 with icon stop
              end try
            end if
          end run
          APPLESCRIPT
          osacompile -o "$HELPER" /tmp/safe-update-r2.applescript
          mkdir -p "$HELPER/Contents/Resources/Payload"
          ditto "$APP" "$HELPER/Contents/Resources/Payload/AI Code Usage.app"
          codesign --verify --deep --strict "$HELPER/Contents/Resources/Payload/AI Code Usage.app"
          codesign --force --deep --sign - "$HELPER"
          codesign --verify --deep --strict "$HELPER"
          printf '%s\n' 'AI Code Usage 안전 업데이트.app을 실행하세요.' '새 AI Code Usage.app은 업데이트 도우미 내부에 포함되어 있어 AppTranslocation에서도 경로가 깨지지 않습니다.' '업데이트 전 기존 앱을 자동 백업하며 문제 시 이전 버전 복구가 가능합니다.' > "$STAGE/먼저 읽어주세요.txt"
          hdiutil create -volname 'AI Code Usage Safe Update R2' -srcfolder "$STAGE" -ov -format UDZO dist/AI-Code-Usage-Mac-M4-v0.6.2-Safe-Update-R2.dmg
      - name: Mount and payload-copy test
        working-directory: /tmp/src/src/desktop
        run: |
          set -euo pipefail
          mkdir -p /tmp/safe-r2-mount /tmp/payload-copy-test
          hdiutil attach dist/AI-Code-Usage-Mac-M4-v0.6.2-Safe-Update-R2.dmg -mountpoint /tmp/safe-r2-mount -nobrowse -readonly
          HELPER='/tmp/safe-r2-mount/AI Code Usage 안전 업데이트.app'
          PAYLOAD="$HELPER/Contents/Resources/Payload/AI Code Usage.app"
          test -d "$HELPER"
          test -d "$PAYLOAD"
          codesign --verify --deep --strict "$HELPER"
          codesign --verify --deep --strict "$PAYLOAD"
          ditto "$PAYLOAD" '/tmp/payload-copy-test/AI Code Usage.app'
          codesign --verify --deep --strict '/tmp/payload-copy-test/AI Code Usage.app'
          file '/tmp/payload-copy-test/AI Code Usage.app/Contents/MacOS/AI Code Usage' | grep arm64
          hdiutil detach /tmp/safe-r2-mount
          shasum -a 256 dist/AI-Code-Usage-Mac-M4-v0.6.2-Safe-Update-R2.dmg > dist/AI-Code-Usage-Mac-M4-v0.6.2-Safe-Update-R2-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Code-Usage-Mac-v0.6.2-Safe-Update-R2
          path: |
            /tmp/src/src/desktop/dist/AI-Code-Usage-Mac-M4-v0.6.2-Safe-Update-R2.dmg
            /tmp/src/src/desktop/dist/AI-Code-Usage-Mac-M4-v0.6.2-Safe-Update-R2-SHA256.txt
          if-no-files-found: error
