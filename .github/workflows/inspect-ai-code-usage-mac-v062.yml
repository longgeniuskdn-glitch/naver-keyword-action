name: Inspect AI Code Usage Mac v0.6.2
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-ai-code-usage-mac-v062.yml'
      - 'tools/patch-ai-code-usage-v062-mac-safe.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Restore and patch v0.6.0
        run: |
          cat ai-code-usage-v050.chunk* | tr -d '[:space:]' | base64 --decode > /tmp/source.zip
          test "$(shasum -a 256 /tmp/source.zip | awk '{print $1}')" = "1a801110f75301d2e934aa31f57d7c0b8907df0632732ca87d56c5ed6a9fe36c"
          unzip -q /tmp/source.zip -d /tmp/src
          python3 tools/patch-ai-code-usage-v055b.py
          python3 tools/patch-ai-code-usage-v056-cache.py
          python3 tools/patch-ai-code-usage-v057-pty.py
          python3 tools/patch-ai-code-usage-v060-claude-oauth.py
      - name: Show exact relevant source
        run: |
          cd /tmp/src/src/desktop
          echo '--- main 20-90 ---'
          sed -n '20,90p' main.js
          echo '--- main 118-250 ---'
          sed -n '118,250p' main.js
          echo '--- core OAuth parser ---'
          grep -n "function normalizeClaudeOauthUsage" -A55 usage-core.js
          echo '--- html ---'
          cat index.html
