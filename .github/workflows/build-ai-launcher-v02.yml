name: Build AI Operations Launcher v0.2

on:
  pull_request:
    branches: [main]
    paths:
      - 'ai_launcher_v02/**'
      - 'tools/build_ai_launcher_v02.py'
      - '.github/workflows/build-ai-launcher-v02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check gdown

      - name: Download sources and build three-module launcher
        run: python tools/build_ai_launcher_v02.py

      - name: Test launcher core
        working-directory: ai_launcher_v02
        run: python -m unittest -v test_launcher.py

      - name: Test adapted modules
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE='dist/우리회사_AI운영실_런처_v0.2/modules'
          for module in part04 part05 part06; do
            echo "===== TEST $module ====="
            cd "$GITHUB_WORKSPACE/$BUNDLE/$module"
            if [ -f test_unittest.py ]; then
              python -m unittest -v test_unittest.py
            elif [ -d tests ]; then
              python -m unittest discover -v
            else
              echo "No unittest file found; continuing to preflight and smoke test."
            fi
            if python app.py --help 2>&1 | grep -q -- '--preflight'; then
              python app.py --preflight
            fi
          done

      - name: Run three-module Linux smoke flow
        working-directory: dist/우리회사_AI운영실_런처_v0.2
        run: python smoke_test.py

      - name: Write verification evidence and clean runtime data
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE='dist/우리회사_AI운영실_런처_v0.2'
          cat > "$BUNDLE/VERIFICATION.md" <<'EOF'
          # 통합 런처 v0.2 검증 기록

          - 환경: GitHub Actions Ubuntu 24.04
          - Python: 3.13
          - 통합 모듈: PART 04, PART 05, PART 06
          - 런처 핵심 자동 테스트: 9개
          - 모듈 자체 테스트: 각 모듈에 포함된 테스트를 재실행
          - 통합 smoke: 세 모듈 자동 탐색 → 실행 → `/health` → 실제 화면 응답 → 종료
          - 데이터 정책: 모듈별 SQLite 및 폴더 분리
          - 검증 범위: Linux 신규 환경
          - 미검증: 실제 사용자 macOS·Windows의 첫 실행과 보안 경고
          EOF
          find "$BUNDLE" -type f \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.log' -o -name '*.pyc' \) -delete
          find "$BUNDLE" -type d \( -name '__pycache__' -o -name '.pytest_cache' \) -prune -exec rm -rf {} + || true
          rm -rf "$BUNDLE/runtime" "$BUNDLE/logs"
          mkdir -p "$BUNDLE/runtime" "$BUNDLE/logs"
          chmod +x "$BUNDLE/START_MAC.command" "$BUNDLE/START_LINUX.sh"
          chmod +x "$BUNDLE/modules/part04/START_MAC.command" 2>/dev/null || true
          chmod +x "$BUNDLE/modules/part05/START_MAC.command" 2>/dev/null || true
          chmod +x "$BUNDLE/modules/part06/START_MAC.command" 2>/dev/null || true

      - name: Upload launcher bundle
        uses: actions/upload-artifact@v4
        with:
          name: 우리회사_AI운영실_런처_v0.2_Linux검증
          path: dist/우리회사_AI운영실_런처_v0.2/
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload PART 04 module-compatible standalone package
        uses: actions/upload-artifact@v4
        with:
          name: PART04_AI_자동화_진단실_모듈호환_v1.1
          path: dist/PART04_AI_자동화_진단실_모듈호환_v1.1/
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload PART 05 module-compatible standalone package
        uses: actions/upload-artifact@v4
        with:
          name: PART05_업무_접수_분류실_모듈호환_v1.1
          path: dist/PART05_업무_접수_분류실_모듈호환_v1.1/
          include-hidden-files: true
          if-no-files-found: error
