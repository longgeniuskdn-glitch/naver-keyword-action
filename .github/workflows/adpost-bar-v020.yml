name: MyVision AdPost Bar v0.2.0 Build

on:
  push:
    branches: [adpost-bar-v020-build]
    paths:
      - 'adpost-build/**'
      - '.github/workflows/adpost-bar-v020.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: adpost-build/work/MyVision-AdPost-Bar-v0.2.0
  SOURCE_SHA256: 938f691fe31c6bf60b90717d1b12d8d7b59e620e4f8385048878da904259b3f5

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild source archive
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p adpost-build/work
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, os
          parts = sorted(Path('adpost-build/parts').glob('part*.txt'))
          encoded = ''.join(p.read_text().strip() for p in parts)
          data = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          assert digest == os.environ['SOURCE_SHA256'], digest
          Path('adpost-build/source.zip').write_bytes(data)
          print('source sha256', digest)
          PY
          unzip -q adpost-build/source.zip -d adpost-build/work
      - name: Install and test
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install
          npm test
          npm run check
          npm run linux:test

  macos-arm64-dmg:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild source archive
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p adpost-build/work
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, os
          parts = sorted(Path('adpost-build/parts').glob('part*.txt'))
          encoded = ''.join(p.read_text().strip() for p in parts)
          data = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          assert digest == os.environ['SOURCE_SHA256'], digest
          Path('adpost-build/source.zip').write_bytes(data)
          print('source sha256', digest)
          PY
          unzip -q adpost-build/source.zip -d adpost-build/work
      - name: Install and test
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install
          npm test
          npm run check
      - name: Build arm64 app directory
        working-directory: ${{ env.APP_DIR }}
        run: npm run dist:dir
      - name: Ad-hoc sign app and verify arm64
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euxo pipefail
          APP="dist/mac-arm64/MyVision AdPost Bar.app"
          BIN="$APP/Contents/MacOS/MyVision AdPost Bar"
          test -x "$BIN"
          file "$BIN" | grep -qi arm64
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Create Mac installer DMG and ZIP
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euxo pipefail
          APP="dist/mac-arm64/MyVision AdPost Bar.app"
          ROOT="$RUNNER_TEMP/adpost-dmg-root"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          ditto "$APP" "$ROOT/MyVision AdPost Bar.app"
          ln -s /Applications "$ROOT/Applications"
          hdiutil create -volname "MyVision AdPost Bar" -srcfolder "$ROOT" -ov -format UDZO "dist/MyVision-AdPost-Bar-0.2.0-arm64.dmg"
          ditto -c -k --keepParent "$APP" "dist/MyVision-AdPost-Bar-0.2.0-arm64.zip"
      - name: Verify DMG mount and install copy
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euxo pipefail
          DMG="dist/MyVision-AdPost-Bar-0.2.0-arm64.dmg"
          MOUNT="$RUNNER_TEMP/adpost-dmg"
          DEST="$RUNNER_TEMP/Applications-test"
          mkdir -p "$MOUNT" "$DEST"
          hdiutil attach "$DMG" -nobrowse -mountpoint "$MOUNT"
          test -d "$MOUNT/MyVision AdPost Bar.app"
          test -L "$MOUNT/Applications"
          ditto "$MOUNT/MyVision AdPost Bar.app" "$DEST/MyVision AdPost Bar.app"
          BIN="$DEST/MyVision AdPost Bar.app/Contents/MacOS/MyVision AdPost Bar"
          file "$BIN" | grep -qi arm64
          codesign --verify --deep --strict --verbose=2 "$DEST/MyVision AdPost Bar.app"
          hdiutil detach "$MOUNT"
          shasum -a 256 "$DMG" "dist/MyVision-AdPost-Bar-0.2.0-arm64.zip"
      - name: Upload Mac installer
        uses: actions/upload-artifact@v4
        with:
          name: MyVision-AdPost-Bar-v0.2.0-macOS-arm64-signed
          path: |
            ${{ env.APP_DIR }}/dist/MyVision-AdPost-Bar-0.2.0-arm64.dmg
            ${{ env.APP_DIR }}/dist/MyVision-AdPost-Bar-0.2.0-arm64.zip
          if-no-files-found: error
