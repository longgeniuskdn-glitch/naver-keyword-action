name: MyVision AdPost Bar v0.2.0 Build

on:
  push:
    branches: [adpost-bar-v020-build]
    paths:
      - 'adpost-build/**'
      - '.github/workflows/adpost-bar-v020.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: adpost-build/work/MyVision-AdPost-Bar-v0.2.0
  SOURCE_SHA256: 938f691fe31c6bf60b90717d1b12d8d7b59e620e4f8385048878da904259b3f5

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild source archive
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p adpost-build/work
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, os
          parts = sorted(Path('adpost-build/parts').glob('part*.txt'))
          assert parts, 'source parts missing'
          encoded = ''.join(p.read_text().strip() for p in parts)
          data = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          expected = os.environ['SOURCE_SHA256']
          assert digest == expected, f'SHA mismatch: {digest} != {expected}'
          Path('adpost-build/source.zip').write_bytes(data)
          print('source sha256', digest)
          PY
          unzip -q adpost-build/source.zip -d adpost-build/work
      - name: Install and test
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install
          npm test
          npm run check
          npm run linux:test

  macos-arm64-dmg:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild source archive
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p adpost-build/work
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, os
          parts = sorted(Path('adpost-build/parts').glob('part*.txt'))
          assert parts, 'source parts missing'
          encoded = ''.join(p.read_text().strip() for p in parts)
          data = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          expected = os.environ['SOURCE_SHA256']
          assert digest == expected, f'SHA mismatch: {digest} != {expected}'
          Path('adpost-build/source.zip').write_bytes(data)
          print('source sha256', digest)
          PY
          unzip -q adpost-build/source.zip -d adpost-build/work
      - name: Install and test
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install
          npm test
          npm run check
      - name: Build arm64 DMG and ZIP
        working-directory: ${{ env.APP_DIR }}
        run: npm run dist:mac
      - name: Verify arm64 app bundle
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euxo pipefail
          APP=$(find dist -type d -name 'MyVision AdPost Bar.app' | head -1)
          test -n "$APP"
          BIN="$APP/Contents/MacOS/MyVision AdPost Bar"
          file "$BIN"
          file "$BIN" | grep -qi arm64
          codesign --verify --deep --strict "$APP" || true
      - name: Verify DMG mount and app copy
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euxo pipefail
          DMG=$(find dist -maxdepth 1 -name '*.dmg' | head -1)
          test -n "$DMG"
          MOUNT="$RUNNER_TEMP/adpost-dmg"
          DEST="$RUNNER_TEMP/Applications"
          mkdir -p "$MOUNT" "$DEST"
          hdiutil attach "$DMG" -nobrowse -mountpoint "$MOUNT"
          test -d "$MOUNT/MyVision AdPost Bar.app"
          ditto "$MOUNT/MyVision AdPost Bar.app" "$DEST/MyVision AdPost Bar.app"
          test -x "$DEST/MyVision AdPost Bar.app/Contents/MacOS/MyVision AdPost Bar"
          hdiutil detach "$MOUNT"
      - name: Upload Mac installer
        uses: actions/upload-artifact@v4
        with:
          name: MyVision-AdPost-Bar-v0.2.0-macOS-arm64
          path: |
            ${{ env.APP_DIR }}/dist/*.dmg
            ${{ env.APP_DIR }}/dist/*.zip
          if-no-files-found: error
