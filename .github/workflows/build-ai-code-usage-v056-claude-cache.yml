name: Build AI Code Usage v0.5.6 Claude Local Cache
on:
  pull_request:
    branches: [ main ]
    paths:
      - "ai-code-usage-v050.chunk*"
      - "tools/patch-ai-code-usage-v055b.py"
      - "tools/patch-ai-code-usage-v056-cache.py"
      - "tools/claude-capture-v055.swift"
      - ".github/workflows/build-ai-code-usage-v056-claude-cache.yml"
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          cat ai-code-usage-v050.chunk* | tr -d '[:space:]' | base64 --decode > /tmp/source.zip
          ACTUAL=$(shasum -a 256 /tmp/source.zip | awk '{print $1}')
          test "$ACTUAL" = "1a801110f75301d2e934aa31f57d7c0b8907df0632732ca87d56c5ed6a9fe36c"
          unzip -q /tmp/source.zip -d /tmp/src
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Apply v0.5.5 diagnostics and v0.5.6 cache fallback
        run: |
          python3 tools/patch-ai-code-usage-v055b.py
          python3 tools/patch-ai-code-usage-v056-cache.py
          cd /tmp/src/src/desktop
          node --check main.js
          node --check usage-core.js
          grep -n "cachedUsageUtilization\|claude-local-cache" main.js usage-core.js
      - name: Prepare official Codex and Claude helper
        working-directory: /tmp/src/src/desktop
        run: |
          mkdir -p vendor
          curl -L --fail --retry 3 https://github.com/openai/codex/releases/latest/download/codex-aarch64-apple-darwin.tar.gz -o /tmp/codex.tar.gz
          tar -xzf /tmp/codex.tar.gz -C /tmp
          cp /tmp/codex-aarch64-apple-darwin vendor/codex
          chmod 755 vendor/codex
          swiftc "$GITHUB_WORKSPACE/tools/claude-capture-v055.swift" -o vendor/claude-capture-v055
          chmod 755 vendor/claude-capture-v055
          vendor/codex --version
      - name: Test Claude cache parser and statusLine fallback
        working-directory: /tmp/src/src/desktop
        run: |
          npm install
          npm test
          rm -rf "$HOME/.ai-code-usage"
          mkdir -p "$HOME/.ai-code-usage"
          printf '%s' '{"version":"2.1.90","rate_limits":{"five_hour":{"used_percentage":23.5,"resets_at":1738425600},"seven_day":{"used_percentage":41.2,"resets_at":1738857600}}}' | vendor/claude-capture-v055 | grep 'CL 5h 24% · 7d 41%'
      - name: Build Mac old-style DMG
        working-directory: /tmp/src/src/desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: npm run dist:mac
      - name: Verify package
        working-directory: /tmp/src/src/desktop
        run: |
          APP=$(find dist -maxdepth 2 -type d -name '*.app' | head -1)
          codesign --verify --deep --strict "$APP"
          file "$APP/Contents/MacOS/AI Code Usage"
          file "$APP/Contents/Resources/vendor/codex"
          file "$APP/Contents/Resources/vendor/claude-capture-v055"
          test -f dist/AI-Code-Usage-Mac-M4-v0.5.6.dmg
          test -f dist/AI-Code-Usage-Mac-M4-v0.5.6.zip
          shasum -a 256 dist/AI-Code-Usage-Mac-M4-v0.5.6.dmg dist/AI-Code-Usage-Mac-M4-v0.5.6.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Code-Usage-Mac-M4-v0.5.6-Claude-Cache
          path: |
            /tmp/src/src/desktop/dist/AI-Code-Usage-Mac-M4-v0.5.6.dmg
            /tmp/src/src/desktop/dist/AI-Code-Usage-Mac-M4-v0.5.6.zip
