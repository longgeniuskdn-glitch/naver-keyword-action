name: Build Codex Usage Bar APK
on:
  pull_request:
    branches: [ main ]
    paths: ["codex-mini.part*", ".github/workflows/build-codex-apk.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: cat codex-mini.part* | base64 --decode > /tmp/app.zip && unzip -q /tmp/app.zip
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.9"}
      - name: Build APK
        working-directory: codex-apk-mini
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp codex-apk-mini/app/build/outputs/apk/debug/app-debug.apk Codex-Usage-Bar-Galaxy-v0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Usage-Bar-Galaxy-v0.1.0
          path: Codex-Usage-Bar-Galaxy-v0.1.0.apk
          if-no-files-found: error
