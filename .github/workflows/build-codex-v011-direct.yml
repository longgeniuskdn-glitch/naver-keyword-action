name: Build corrected Codex Usage Bar v0.1.1

on:
  pull_request:
    branches: [ main ]
    paths:
      - "codex-v011/**"
      - ".github/workflows/build-codex-v011-direct.yml"

jobs:
  android:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android activity source
        run: |
          mkdir -p codex-v011/android/app/src/main/java/com/myvision/codexusagebar
          cat codex-v011/android/MainActivity.java.part*.b64 | base64 --decode > codex-v011/android/app/src/main/java/com/myvision/codexusagebar/MainActivity.java
          test -s codex-v011/android/app/src/main/java/com/myvision/codexusagebar/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: codex-v011/android
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp codex-v011/android/app/build/outputs/apk/debug/app-debug.apk Codex-Usage-Bar-Galaxy-v0.1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Usage-Bar-Galaxy-v0.1.1
          path: Codex-Usage-Bar-Galaxy-v0.1.1.apk
          if-no-files-found: error

  mac:
    runs-on: macos-14
    permissions: { contents: read }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Restore Mac source
        run: |
          cat codex-v011/mac-source.part*.b64 | base64 --decode > /tmp/codex-mac-v011.zip
          ditto -x -k /tmp/codex-mac-v011.zip .
          test -f codex-mac-v011/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: codex-mac-v011
        run: npm install --no-audit --no-fund
      - name: Test usage calculations
        working-directory: codex-mac-v011
        run: npm test
      - name: Build Apple Silicon installer
        working-directory: codex-mac-v011
        run: npx electron-builder --mac dmg zip --arm64
      - name: Prepare Mac downloads
        run: |
          mkdir -p mac-output
          DMG=$(find codex-mac-v011/dist -maxdepth 1 -name '*.dmg' | head -1)
          ZIP=$(find codex-mac-v011/dist -maxdepth 1 -name '*arm64*.zip' | head -1)
          test -n "$DMG" && cp "$DMG" mac-output/Codex-Usage-Bar-Mac-M4-v0.1.1.dmg
          test -n "$ZIP" && cp "$ZIP" mac-output/Codex-Usage-Bar-Mac-M4-v0.1.1.zip
          ls -lah mac-output
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Usage-Bar-Mac-M4-v0.1.1
          path: mac-output/*
          if-no-files-found: error
