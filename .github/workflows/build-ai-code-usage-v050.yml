name: Build AI Code Usage v0.5.0
on:
  pull_request:
    branches: [ main ]
    paths:
      - "ai-code-usage-v050.chunk*"
      - ".github/workflows/build-ai-code-usage-v050.yml"
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          python3 - <<'PY'
          import base64, glob, hashlib, re, sys
          all_clean = ''
          for f in sorted(glob.glob('ai-code-usage-v050.chunk*')):
              raw = open(f, encoding='utf-8').read()
              clean = re.sub(r'\s+', '', raw)
              bad = ''.join(ch for ch in clean if ch not in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
              print(f, 'len=', len(clean), 'sha=', hashlib.sha256(clean.encode()).hexdigest(), 'bad=', repr(bad[:40]))
              all_clean += clean
          data = base64.b64decode(all_clean, validate=False)
          actual = hashlib.sha256(data).hexdigest()
          print('decoded_sha=', actual, 'bytes=', len(data))
          open('/tmp/source.zip','wb').write(data)
          if actual != '1a801110f75301d2e934aa31f57d7c0b8907df0632732ca87d56c5ed6a9fe36c':
              sys.exit('source SHA mismatch')
          PY
          unzip -q /tmp/source.zip -d /tmp/src
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build APK
        working-directory: /tmp/src/src/android
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare
        run: cp /tmp/src/src/android/app/build/outputs/apk/debug/app-debug.apk AI-Code-Usage-Android-v0.5.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Code-Usage-Android-v0.5.0
          path: AI-Code-Usage-Android-v0.5.0.apk

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          cat ai-code-usage-v050.chunk* | tr -d '[:space:]' | base64 --decode > /tmp/source.zip
          ACTUAL=$(shasum -a 256 /tmp/source.zip | awk '{print $1}')
          test "$ACTUAL" = "1a801110f75301d2e934aa31f57d7c0b8907df0632732ca87d56c5ed6a9fe36c"
          unzip -q /tmp/source.zip -d /tmp/src
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Prepare official Codex and Claude capture helper
        working-directory: /tmp/src/src/desktop
        run: |
          mkdir -p vendor
          curl -L --fail --retry 3 https://github.com/openai/codex/releases/latest/download/codex-aarch64-apple-darwin.tar.gz -o /tmp/codex.tar.gz
          tar -xzf /tmp/codex.tar.gz -C /tmp
          cp /tmp/codex-aarch64-apple-darwin vendor/codex
          chmod 755 vendor/codex
          swiftc claude_capture.swift -o vendor/claude-capture
          chmod 755 vendor/claude-capture
          vendor/codex --version
      - name: Test Claude official rate_limits capture
        working-directory: /tmp/src/src/desktop
        run: |
          printf '%s' '{"version":"2.1.90","rate_limits":{"five_hour":{"used_percentage":23.5,"resets_at":1738425600},"seven_day":{"used_percentage":41.2,"resets_at":1738857600}}}' | vendor/claude-capture | grep 'CL 5h 24% · 7d 41%'
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path.home()/'.ai-code-usage/claude-usage.json'
          j=json.loads(p.read_text())
          assert j['fiveHour']['usedPercent']==23.5
          assert j['sevenDay']['usedPercent']==41.2
          print('Claude capture PASS')
          PY
      - name: Install, test and build
        working-directory: /tmp/src/src/desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: npm install && npm test && npm run dist:mac
      - name: Collect
        run: |
          cp /tmp/src/src/desktop/dist/AI-Code-Usage-Mac-M4-v0.5.0.dmg .
          cp /tmp/src/src/desktop/dist/AI-Code-Usage-Mac-M4-v0.5.0.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Code-Usage-Mac-M4-v0.5.0
          path: |
            AI-Code-Usage-Mac-M4-v0.5.0.dmg
            AI-Code-Usage-Mac-M4-v0.5.0.zip

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        shell: powershell
        run: |
          $raw=(((Get-Content ai-code-usage-v050.chunk* -Raw) -join '')) -replace '\s',''
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\source.zip",[Convert]::FromBase64String($raw))
          $hash=(Get-FileHash "$env:RUNNER_TEMP\source.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "1a801110f75301d2e934aa31f57d7c0b8907df0632732ca87d56c5ed6a9fe36c") { throw "source SHA mismatch: $hash" }
          Expand-Archive "$env:RUNNER_TEMP\source.zip" "$env:RUNNER_TEMP\src" -Force
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Prepare official Codex and Claude statusline helper
        shell: powershell
        working-directory: ${{ runner.temp }}\src\src\desktop
        run: |
          New-Item vendor -ItemType Directory -Force | Out-Null
          Invoke-WebRequest -Uri "https://github.com/openai/codex/releases/latest/download/codex-x86_64-pc-windows-msvc.exe.zip" -OutFile "$env:RUNNER_TEMP\codex.zip"
          Expand-Archive "$env:RUNNER_TEMP\codex.zip" "$env:RUNNER_TEMP\codex" -Force
          $exe=Get-ChildItem "$env:RUNNER_TEMP\codex" -Recurse -Filter "codex*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName vendor\codex.exe
          Copy-Item claude-statusline.ps1 vendor\claude-statusline.ps1
          .\vendor\codex.exe --version
      - name: Test Claude official rate_limits capture
        shell: powershell
        working-directory: ${{ runner.temp }}\src\src\desktop
        run: |
          $json='{"version":"2.1.90","rate_limits":{"five_hour":{"used_percentage":23.5,"resets_at":1738425600},"seven_day":{"used_percentage":41.2,"resets_at":1738857600}}}'
          $out=$json | powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\vendor\claude-statusline.ps1
          if ($out -notmatch 'CL 5h 24%.*7d 41%') { throw "Claude statusline test failed: $out" }
          $j=Get-Content (Join-Path $HOME '.ai-code-usage\claude-usage.json') -Raw | ConvertFrom-Json
          if ([double]$j.fiveHour.usedPercent -ne 23.5 -or [double]$j.sevenDay.usedPercent -ne 41.2) { throw 'Claude JSON capture failed' }
      - name: Install, test and build
        shell: powershell
        working-directory: ${{ runner.temp }}\src\src\desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: npm install; npm test; npm run dist:win
      - name: Collect
        shell: powershell
        run: |
          Copy-Item "$env:RUNNER_TEMP\src\src\desktop\dist\AI-Code-Usage-Windows-Setup-v0.5.0.exe" .
          Copy-Item "$env:RUNNER_TEMP\src\src\desktop\dist\AI-Code-Usage-Windows-Portable-v0.5.0.exe" .
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Code-Usage-Windows-v0.5.0
          path: |
            AI-Code-Usage-Windows-Setup-v0.5.0.exe
            AI-Code-Usage-Windows-Portable-v0.5.0.exe

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          cat ai-code-usage-v050.chunk* | tr -d '[:space:]' | base64 --decode > /tmp/source.zip
          ACTUAL=$(shasum -a 256 /tmp/source.zip | awk '{print $1}')
          test "$ACTUAL" = "1a801110f75301d2e934aa31f57d7c0b8907df0632732ca87d56c5ed6a9fe36c"
          unzip -q /tmp/source.zip -d /tmp/src
      - name: Build iOS Simulator
        working-directory: /tmp/src/src/ios
        run: |
          xcodebuild -project AICodeUsage.xcodeproj -scheme AICodeUsage -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Package Xcode project
        working-directory: /tmp/src/src
        run: zip -qr "$GITHUB_WORKSPACE/AI-Code-Usage-iPhone-Xcode-v0.5.0.zip" ios
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Code-Usage-iPhone-Xcode-v0.5.0
          path: AI-Code-Usage-iPhone-Xcode-v0.5.0.zip
