name: Build AI Code Usage v0.6.0 Claude OAuth

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ai-code-usage-v050.chunk*'
      - 'tools/patch-ai-code-usage-v055b.py'
      - 'tools/patch-ai-code-usage-v056-cache.py'
      - 'tools/patch-ai-code-usage-v057-pty.py'
      - 'tools/patch-ai-code-usage-v060-claude-oauth.py'
      - 'tools/claude-capture-v055.swift'
      - '.github/workflows/build-ai-code-usage-v060-claude-oauth.yml'

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          cat ai-code-usage-v050.chunk* | tr -d '[:space:]' | base64 --decode > /tmp/source.zip
          ACTUAL=$(shasum -a 256 /tmp/source.zip | awk '{print $1}')
          test "$ACTUAL" = "1a801110f75301d2e934aa31f57d7c0b8907df0632732ca87d56c5ed6a9fe36c"
          unzip -q /tmp/source.zip -d /tmp/src
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v0.6.0 Claude OAuth implementation
        run: |
          python3 tools/patch-ai-code-usage-v055b.py
          python3 tools/patch-ai-code-usage-v056-cache.py
          python3 tools/patch-ai-code-usage-v057-pty.py
          python3 tools/patch-ai-code-usage-v060-claude-oauth.py
          cd /tmp/src/src/desktop
          node --check main.js
          node --check usage-core.js
          grep -n "api.anthropic.com/api/oauth/usage\|Claude Code-credentials\|oauth-2025-04-20\|0.6.0" main.js package.json index.html
      - name: Test Claude OAuth parser
        working-directory: /tmp/src/src/desktop
        run: |
          npm install
          node --test test/claude-oauth.test.js
          npm test
      - name: Prepare official Codex binary
        working-directory: /tmp/src/src/desktop
        run: |
          mkdir -p vendor
          curl -L --fail --retry 3 https://github.com/openai/codex/releases/latest/download/codex-aarch64-apple-darwin.tar.gz -o /tmp/codex.tar.gz
          tar -xzf /tmp/codex.tar.gz -C /tmp
          cp /tmp/codex-aarch64-apple-darwin vendor/codex
          chmod 755 vendor/codex
          # v0.5.5 packaging still lists the old fallback helper; keep it bundled but unused.
          swiftc "$GITHUB_WORKSPACE/tools/claude-capture-v055.swift" -o vendor/claude-capture-v055
          chmod 755 vendor/claude-capture-v055
          vendor/codex --version
      - name: Build Mac DMG
        working-directory: /tmp/src/src/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac
      - name: Verify package
        working-directory: /tmp/src/src/desktop
        run: |
          APP=$(find dist -maxdepth 2 -type d -name '*.app' | head -1)
          codesign --verify --deep --strict "$APP"
          file "$APP/Contents/MacOS/AI Code Usage"
          file "$APP/Contents/Resources/vendor/codex"
          test -f dist/AI-Code-Usage-Mac-M4-v0.6.0.dmg
          test -f dist/AI-Code-Usage-Mac-M4-v0.6.0.zip
          shasum -a 256 dist/AI-Code-Usage-Mac-M4-v0.6.0.dmg dist/AI-Code-Usage-Mac-M4-v0.6.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Code-Usage-Mac-M4-v0.6.0-Claude-OAuth
          path: |
            /tmp/src/src/desktop/dist/AI-Code-Usage-Mac-M4-v0.6.0.dmg
            /tmp/src/src/desktop/dist/AI-Code-Usage-Mac-M4-v0.6.0.zip
          if-no-files-found: error
